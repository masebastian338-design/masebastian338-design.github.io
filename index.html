<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Together English</title>
  <meta name="description" content="Plataforma para aprender inglés en pareja">

  <!-- PWA: permite instalar la web como app en el celular -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Together English">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Aquí se dibuja toda la app (lo hace js/app.js) -->
  <div id="app">
    <div class="cargando">
      <div class="logo-grande">🗣️</div>
      <p>Cargando…</p>
    </div>
  </div>

  <noscript>Esta web necesita JavaScript activado.</noscript>

  <!-- type="module" permite usar import/export sin herramientas extra -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
